[package]
name = "oterm"
version = "0.2.3"
description = "Advanced terminal emulator"
authors = ["Oerum"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "oterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
whisper-metal = ["whisper-rs/metal"]
whisper-vulkan = ["whisper-rs/vulkan"]
whisper-cuda = ["whisper-rs/cuda"]
whisper-openblas = ["whisper-rs/openblas"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
cpal = "0.15"
hound = "3.5"
whisper-rs = { version = "0.16", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.17"
tauri-plugin-prevent-default = "5.0.0"
russh = "0.52"
russh-sftp = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
async-trait = "0.1"
sysinfo = "0.33"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
win-context-menu = "0.1"
windows-registry = "0.5"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
