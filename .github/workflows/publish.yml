name: 'publish'

on:
  push:
    tags:
      - 'v*.*.*' # Recommended standard: Trigger only on immutable release tags (e.g., v1.2.3)
  workflow_dispatch:

permissions:
  contents: write # Required to create the GitHub Release and upload assets

jobs:
  publish-tauri:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: macOS (Metal)
            platform: macos-latest
            whisper_features: whisper-metal
            product_suffix: ''
            bundle_targets: ''
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: false
            include_updater: true

          - job_name: Windows (Vulkan)
            platform: windows-latest
            whisper_features: whisper-vulkan
            product_suffix: ''
            bundle_targets: ''
            install_vulkan: true
            install_llvm: true
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: false
            include_updater: true

          - job_name: Windows (CUDA)
            platform: windows-2022
            whisper_features: whisper-cuda
            product_suffix: ' CUDA'
            bundle_targets: ''
            install_vulkan: false
            install_llvm: true
            install_cuda: true
            install_openblas: false
            install_vulkan_linux: false
            include_updater: false

          - job_name: Linux (Vulkan)
            platform: ubuntu-22.04
            whisper_features: whisper-vulkan
            product_suffix: ''
            bundle_targets: ''
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: true
            include_updater: true

          - job_name: Linux (CUDA)
            platform: ubuntu-22.04
            whisper_features: whisper-cuda
            product_suffix: ' CUDA'
            # AppImage bundling fails in CI (linuxdeploy exits immediately on CUDA-linked binary); deb/rpm work.
            bundle_targets: ',"targets":["deb","rpm"]'
            install_vulkan: false
            install_llvm: false
            install_cuda: true
            install_openblas: false
            install_vulkan_linux: false
            include_updater: false

          - job_name: Linux (OpenBLAS)
            platform: ubuntu-22.04
            whisper_features: whisper-openblas
            product_suffix: ' CPU'
            bundle_targets: ''
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: true
            install_vulkan_linux: false
            include_updater: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vulkan SDK
        if: matrix.install_vulkan
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          $dest = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$dest\Include\vulkan\vulkan.h")) {
            $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" -OutFile $installer
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK" | Out-Null
            & $installer --root $dest --accept-licenses --default-answer --confirm-command install
          }
          & "$dest\bin\glslangValidator.exe" --version
          "VULKAN_SDK=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_INCLUDE_DIR=$dest\Include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_LIBRARY=$dest\Lib\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install LLVM
        if: matrix.install_llvm
        run: choco install llvm -y

      - name: Install Ninja (Windows CUDA)
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        run: choco install ninja -y

      - name: Install CUDA toolkit (Windows)
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
          method: network

      - name: Install CUDA toolkit (Linux)
        if: matrix.install_cuda && matrix.platform == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
          method: network

      - name: Export CUDA library path (Linux)
        if: matrix.install_cuda && matrix.platform == 'ubuntu-22.04'
        run: |
          CUDA_ROOT="${CUDA_PATH:-/usr/local/cuda-13.2}"
          CUDA_LIB="$CUDA_ROOT/targets/x86_64-linux/lib"
          if [ ! -d "$CUDA_LIB" ]; then
            CUDA_LIB="$CUDA_ROOT/lib64"
          fi
          echo "LIBRARY_PATH=$CUDA_LIB:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CUDA_LIB:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$CUDA_LIB" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$CUDA_LIB" >> "$GITHUB_ENV"

      - name: Integrate CUDA with Visual Studio
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $src = Join-Path $env:CUDA_PATH 'extras\visual_studio_integration\MSBuildExtensions'
          if (-not (Test-Path $src)) {
            throw "CUDA Visual Studio integration files not found at $src"
          }
          $dests = @(
            Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\BuildCustomizations' -Directory -ErrorAction SilentlyContinue
            Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\*\BuildCustomizations' -Directory -ErrorAction SilentlyContinue
          )
          if (-not $dests) {
            throw 'No Visual Studio BuildCustomizations directory found'
          }
          foreach ($dest in $dests) {
            Copy-Item -Path "$src\*" -Destination $dest.FullName -Force
            Write-Host "Installed CUDA MSBuild integration in $($dest.FullName)"
          }
          $nvcc = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
          if (-not (Test-Path $nvcc)) { throw "nvcc not found at $nvcc" }
          $nvccCmake = $nvcc -replace '\\', '/'
          "CMAKE_CUDA_COMPILER=$nvccCmake" >> $env:GITHUB_ENV
          "CUDACXX=$nvcc" >> $env:GITHUB_ENV

      - name: Initialize MSVC dev environment
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Set CUDA compile flags (Windows)
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $cudaInclude = Join-Path $env:CUDA_PATH 'include'
          "INCLUDE=$cudaInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_CUDA_FLAGS=--use-local-env -allow-unsupported-compiler" >> $env:GITHUB_ENV

      - name: Set Windows build env
        if: contains(matrix.platform, 'windows')
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/oterm-t" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.whisper_features }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev cmake pkg-config libfuse2
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          if [ "${{ matrix.install_openblas }}" = "true" ]; then
            sudo apt-get install -y libopenblas-dev
            echo "BLAS_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu/openblas" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.install_vulkan_linux }}" = "true" ]; then
            sudo apt-get install -y libvulkan-dev
            VULKAN_SDK_VERSION="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/linux.txt)"
            VULKAN_SDK_DIR="$RUNNER_TEMP/vulkan-sdk-$VULKAN_SDK_VERSION"
            if [ ! -f "$VULKAN_SDK_DIR/setup-env.sh" ]; then
              mkdir -p "$VULKAN_SDK_DIR"
              curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz" |
                tar -xJ --strip-components=1 -C "$VULKAN_SDK_DIR"
            fi
            # shellcheck disable=SC1091
            source "$VULKAN_SDK_DIR/setup-env.sh"
            VULKAN_LIB="$VULKAN_SDK/lib/VulkanLoader/lib/libvulkan.so"
            if [ ! -f "$VULKAN_LIB" ]; then
              VULKAN_LIB="$(find "$VULKAN_SDK/lib/VulkanLoader" -name 'libvulkan.so' -type f | head -1)"
            fi
            test -n "$VULKAN_LIB" && test -f "$VULKAN_LIB"
            echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
            echo "Vulkan_INCLUDE_DIR=$VULKAN_SDK/include" >> "$GITHUB_ENV"
            echo "Vulkan_LIBRARY=$VULKAN_LIB" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=$VULKAN_SDK/lib/VulkanLoader/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "PATH=$PATH" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            command -v glslc
            test -f "$VULKAN_SDK/include/vulkan/vulkan.h"
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version from git tag
        if: github.ref_type == 'tag'
        run: node scripts/sync-version.mjs --from-tag "${{ github.ref_name }}"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: node scripts/verify-tag-version.mjs "${{ github.ref_name }}"

      - name: Prepare Tauri bundle config (Windows)
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $bundleTargets = '${{ matrix.bundle_targets }}'
          $productName = "OTerm${{ matrix.product_suffix }}"

          if ('${{ matrix.install_cuda }}' -ne 'true') {
            $config = "{`"productName`":`"$productName`",`"bundle`":{`"createUpdaterArtifacts`":false$bundleTargets}}"
            Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CONFIG_JSON<<EOF"
            Add-Content -Path $env:GITHUB_ENV -Value $config
            Add-Content -Path $env:GITHUB_ENV -Value "EOF"
            exit 0
          }

          $dest = Join-Path $PWD 'src-tauri/cuda-runtime'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $binDirs = @(
            Join-Path $env:CUDA_PATH 'bin\x64'
            Join-Path $env:CUDA_PATH 'bin'
          ) | Where-Object { Test-Path $_ }
          if ($binDirs.Count -eq 0) {
            throw "CUDA bin directory not found under $($env:CUDA_PATH)"
          }

          $patterns = @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')
          $copied = @()
          foreach ($bin in $binDirs) {
            foreach ($pattern in $patterns) {
              Get-ChildItem -Path $bin -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
                if ($copied -notcontains $_.Name) {
                  Copy-Item $_.FullName -Destination $dest -Force
                  $copied += $_.Name
                }
              }
            }
          }
          if ($copied.Count -eq 0) {
            throw "No CUDA runtime DLLs found in $($binDirs -join ', ')"
          }
          Write-Host "Staged CUDA runtime DLLs: $($copied -join ', ')"

          $resources = [ordered]@{}
          foreach ($name in $copied) {
            $resources["cuda-runtime/$name"] = $name
          }
          $resources['icons/icon.ico'] = 'icons/icon.ico'

          $configObj = [ordered]@{
            productName = $productName
            bundle = [ordered]@{
              createUpdaterArtifacts = $false
              resources = $resources
            }
          }

          $config = ($configObj | ConvertTo-Json -Compress -Depth 6)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CONFIG_JSON<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $config
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Prepare Tauri bundle config (Unix)
        if: "!contains(matrix.platform, 'windows')"
        shell: bash
        run: |
          {
            echo 'TAURI_CONFIG_JSON<<EOF'
            echo '{"productName":"OTerm${{ matrix.product_suffix }}","bundle":{"createUpdaterArtifacts":false${{ matrix.bundle_targets }}}}'
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'OTerm v__VERSION__'
          releaseBody: 'Release generated automatically by CI/CD pipeline.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --features ${{ matrix.whisper_features }} -c '${{ env.TAURI_CONFIG_JSON }}'

      - name: Verify Windows CUDA runtime bundle
        if: matrix.install_cuda && contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $releaseDir = 'C:/oterm-t/release'
          $exePath = Join-Path $releaseDir 'oterm.exe'
          if (-not (Test-Path $exePath)) {
            $exe = Get-ChildItem -Path 'C:/oterm-t/release/bundle' -Recurse -Filter 'oterm.exe' -ErrorAction Stop |
              Select-Object -First 1
            $exePath = $exe.FullName
          }
          $dir = Split-Path $exePath -Parent
          $staged = Get-ChildItem -Path 'src-tauri/cuda-runtime' -Filter '*.dll' -ErrorAction Stop
          foreach ($dll in $staged) {
            $installed = Join-Path $dir $dll.Name
            if (-not (Test-Path $installed)) {
              throw "Bundled CUDA DLL missing from install tree: $($dll.Name) (expected at $installed)"
            }
          }
          Write-Host "Verified $($staged.Count) CUDA runtime DLL(s) beside oterm.exe in $dir"
