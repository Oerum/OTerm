name: 'publish'

on:
  push:
    tags:
      - 'v*.*.*' # Recommended standard: Trigger only on immutable release tags (e.g., v1.2.3)

permissions:
  contents: write # Required to create the GitHub Release and upload assets

jobs:
  publish-tauri:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: macOS (Metal)
            platform: macos-latest
            whisper_features: whisper-metal
            product_suffix: ''
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: false
            include_updater: true

          - job_name: Windows (Vulkan)
            platform: windows-latest
            whisper_features: whisper-vulkan
            product_suffix: ' Vulkan'
            install_vulkan: true
            install_llvm: true
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: false
            include_updater: true

          - job_name: Windows (CUDA)
            platform: windows-latest
            whisper_features: whisper-cuda
            product_suffix: ' CUDA'
            install_vulkan: false
            install_llvm: true
            install_cuda: true
            install_openblas: false
            install_vulkan_linux: false
            include_updater: false

          - job_name: Linux (Vulkan)
            platform: ubuntu-22.04
            whisper_features: whisper-vulkan
            product_suffix: ' Vulkan'
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: false
            install_vulkan_linux: true
            include_updater: true

          - job_name: Linux (CUDA)
            platform: ubuntu-22.04
            whisper_features: whisper-cuda
            product_suffix: ' CUDA'
            install_vulkan: false
            install_llvm: false
            install_cuda: true
            install_openblas: false
            install_vulkan_linux: false
            include_updater: false

          - job_name: Linux (OpenBLAS)
            platform: ubuntu-22.04
            whisper_features: whisper-openblas
            product_suffix: ' CPU'
            install_vulkan: false
            install_llvm: false
            install_cuda: false
            install_openblas: true
            install_vulkan_linux: false
            include_updater: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Vulkan SDK
        if: matrix.install_vulkan
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          $dest = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$dest\Include\vulkan\vulkan.h")) {
            $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" -OutFile $installer
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK" | Out-Null
            & $installer --root $dest --accept-licenses --default-answer --confirm-command install
          }
          & "$dest\bin\glslangValidator.exe" --version
          "VULKAN_SDK=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_INCLUDE_DIR=$dest\Include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_LIBRARY=$dest\Lib\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install LLVM
        if: matrix.install_llvm
        run: choco install llvm -y

      - name: Install CUDA toolkit
        if: matrix.install_cuda
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.6.0'
          method: network

      - name: Set Windows build env
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/oterm-t" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.whisper_features }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev cmake pkg-config
          if [ "${{ matrix.install_openblas }}" = "true" ]; then
            sudo apt-get install -y libopenblas-dev
            echo "BLAS_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu/openblas" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.install_vulkan_linux }}" = "true" ]; then
            curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
            echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan jammy main" \
              | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev glslang-tools shaderc
            command -v glslc
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'OTerm v__VERSION__'
          releaseBody: 'Release generated automatically by CI/CD pipeline.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --features ${{ matrix.whisper_features }} -c '{"productName":"OTerm${{ matrix.product_suffix }}","bundle":{"createUpdaterArtifacts":false}}'
