name: 'publish'

on:
  push:
    tags:
      - 'v*.*.*' # Recommended standard: Trigger only on immutable release tags (e.g., v1.2.3)
    branches:
      - 'v*.*.*' # Included to support your requested branch pushes, but strongly discouraged

permissions:
  contents: write # Required to create the GitHub Release and upload assets

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          $dest = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$dest\Include\vulkan\vulkan.h")) {
            $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" -OutFile $installer
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK" | Out-Null
            & $installer --root $dest --accept-licenses --default-answer --confirm-command install
          }
          & "$dest\bin\glslangValidator.exe" --version
          "VULKAN_SDK=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_INCLUDE_DIR=$dest\Include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan_LIBRARY=$dest\Lib\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install LLVM
        if: matrix.platform == 'windows-latest'
        run: choco install llvm -y

      - name: Set Windows build env
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/oterm-t" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev cmake pkg-config
          echo "BLAS_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu/openblas" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing only on tag releases; branch pushes skip signing (see scripts/tauri.mjs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_KEY_PASSWORD || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'OTerm v__VERSION__'
          releaseBody: 'Release generated automatically by CI/CD pipeline.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ github.ref_type == 'tag' }}
          args: ${{ matrix.args }}
